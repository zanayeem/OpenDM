name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go test ./...
      - run: |
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist/$arch/OpenDM.exe .
            cp -r extension dist/$arch/browser-extension
            cp README.md LICENSE dist/$arch/
            (cd dist/$arch && zip -qr ../OpenDM-windows-$arch.zip .)
          done
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.zip
